# Offline test suite for Sentinel AI.
# No Databricks credentials, API access or model calls are needed: tests use synthetic data and
# fakes, and tests/conftest.py blocks all network access. Tests that need local CFPB data files
# (not stored in Git) are skipped automatically.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Offline test suite (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Run offline test suite
        run: python -m pytest -ra
