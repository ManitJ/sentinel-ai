<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1520" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<title id="title">What drove the 45.6% increase in credit-reporting complaints?</title>
<desc id="desc">Waterfall chart. Jan–Oct 2025: 3,906,784 complaints. Incorrect information on your report: +1,135,926 (63.71% of the net increase); Problem with a company's investigation into an existing problem or issue: +396,735 (22.25% of the net increase); Improper use of your report: +241,822 (13.56% of the net increase); Other 9 issue groups: +8,604 (0.48% of the net increase). Jan–Oct 2026: 5,689,871 complaints. Net change +1,783,087 (+45.6%). Largest driver: Incorrect information on your report.</desc>
<rect width="1200" height="760" fill="#fcfcfb"/>
<text x="40.0" y="52.0" font-size="24" fill="#0b0b0b" text-anchor="start" font-weight="600">What drove the 45.6% increase in credit-reporting complaints?</text>
<text x="40.0" y="80.0" font-size="15" fill="#52514e" text-anchor="start" font-weight="normal">CFPB credit-reporting complaints by issue group, Jan–Oct 2025 vs Jan–Oct 2026: net change +1,783,087 complaints (+45.6%)</text>
