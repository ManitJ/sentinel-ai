<text x="40.0" y="652.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">Comparison covers January–October of each year (Jan–Oct 2025 vs Jan–Oct 2026), not full calendar years. Contribution = issue group's net change ÷ total net change.</text>
<text x="40.0" y="668.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">* Other 9 issue groups: 2 increased (+9,438) and 7 decreased (−834), net +8,604. Bar drawn to scale (under 1 pixel tall); the callout marks its position.</text>
<text x="40.0" y="684.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">September and October 2026 response metrics are provisional (at least 1% of complaints still awaiting a company response); complaint volumes are counted at intake and remain usable.</text>
<text x="40.0" y="700.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">Complaints are unverified consumer reports: counts do not establish wrongdoing and are not adjusted for company size. Issue groups are CFPB categories.</text>
<text x="40.0" y="736.0" font-size="11" fill="#898781" text-anchor="start" font-weight="normal">Source: CFPB Consumer Complaint Database (credit reporting), exact counts via Sentinel AI query Q5.3 (sql/05_growth_drivers.sql). Data snapshot: November 12, 2026.</text>
